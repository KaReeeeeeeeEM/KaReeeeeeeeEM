<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#010409">
  <title>Kareem // Snake Mode</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      min-height: 100vh; margin: 0; display: grid; place-items: center;
      background: #010409; color: #c9d1d9;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    }
    main { width: min(94vw, 900px); padding: 24px 0; text-align: center; }
    .frame {
      position: relative; overflow: hidden; border: 1px solid #30363d;
      border-radius: 16px; background: #0d1117; box-shadow: 0 20px 80px #000;
      transition: border-color .2s, transform .2s;
    }
    .frame:hover { border-color: #39d353; transform: translateY(-2px); }
    img { display: block; width: 100%; min-height: 120px; user-select: none; }
    button {
      margin-top: 20px; padding: 11px 16px; border: 1px solid #238636;
      border-radius: 8px; background: #238636; color: white; font: inherit;
      cursor: pointer;
    }
    button:hover { background: #2ea043; }
    button:focus-visible { outline: 3px solid #58a6ff; outline-offset: 3px; }
    p { color: #8b949e; font-size: 13px; }
    .spark {
      position: fixed; width: 8px; height: 8px; border-radius: 2px;
      background: #39d353; pointer-events: none; animation: vanish .7s forwards;
      box-shadow: 0 0 12px #39d353;
    }
    @keyframes vanish { to { opacity: 0; transform: scale(3) rotate(90deg); } }
    @media (prefers-reduced-motion: reduce) {
      .frame { transition: none; }
      .frame:hover { transform: none; }
      .spark { display: none; }
    }
  </style>
</head>
<body>
  <main>
    <div class="frame" id="field">
      <img src="https://raw.githubusercontent.com/KaReeeeeeeeEM/KaReeeeeeeeEM/output/github-contribution-grid-snake-dark.svg" alt="Animated snake eating Kareem's GitHub contributions">
    </div>
    <button id="sound" type="button">▶ Enable snake sound</button>
    <p>Move across the grid. Click anywhere to feed the snake.</p>
  </main>
  <script>
    const button = document.querySelector('#sound');
    const field = document.querySelector('#field');
    const reducedMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
    let audio;
    let enabled = false;

    function tone(frequency = 440, duration = 0.06) {
      if (!enabled || !audio) return;
      const oscillator = audio.createOscillator();
      const gain = audio.createGain();
      oscillator.type = 'square';
      oscillator.frequency.value = frequency;
      gain.gain.setValueAtTime(0.025, audio.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.0001, audio.currentTime + duration);
      oscillator.connect(gain).connect(audio.destination);
      oscillator.start();
      oscillator.stop(audio.currentTime + duration);
    }

    function sparkAt(x, y) {
      if (reducedMotion) return;
      const spark = document.createElement('i');
      spark.className = 'spark';
      spark.style.left = `${x - 4}px`;
      spark.style.top = `${y - 4}px`;
      document.body.append(spark);
      setTimeout(() => spark.remove(), 700);
    }

    button.addEventListener('click', async () => {
      const AudioContextClass = window.AudioContext || window.webkitAudioContext;
      if (!AudioContextClass) {
        button.textContent = 'Audio is unavailable in this browser';
        button.disabled = true;
        return;
      }
      audio ||= new AudioContextClass();
      await audio.resume();
      enabled = !enabled;
      button.textContent = enabled ? '🔊 Snake sound: ON' : '🔇 Snake sound: OFF';
      tone(660, .1);
    });

    field.addEventListener('pointermove', event => {
      sparkAt(event.clientX, event.clientY);
      if (Math.random() < .08) tone(220 + Math.random() * 220);
    });

    field.addEventListener('click', event => {
      tone(880, .12);
      for (let i = 0; i < 12; i++) {
        sparkAt(
          event.clientX + (Math.random() - .5) * 60,
          event.clientY + (Math.random() - .5) * 60
        );
      }
    });
  </script>
</body>
</html>
